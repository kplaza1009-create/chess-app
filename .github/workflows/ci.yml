name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, Ruff, mypy, Alembic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: chess_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: chess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess_test -d chess_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://chess_test:test_only_password@localhost:5432/chess_test
      TEST_DATABASE_URL: postgresql+psycopg://chess_test:test_only_password@localhost:5432/chess_test
      JWT_SECRET: test-only-signing-key-never-use-in-production-123456
      BCRYPT_ROUNDS: "4"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install dependencies
        run: pip install -r requirements-dev.lock
      # Run against a non-UTC database so timezone regressions stay covered.
      - name: Use a non-UTC database timezone
        run: >-
          PGPASSWORD=test_only_password psql -h localhost -U chess_test -d chess_test
          -c "ALTER DATABASE chess_test SET timezone TO 'America/New_York'"
      - name: Migrate
        run: |
          alembic upgrade head
          alembic check
      - name: Ruff
        run: ruff check --no-cache app alembic tests engine_tests scripts
      - name: mypy
        run: mypy --cache-dir=/tmp/chess-mypy
      - name: Tests
        run: pytest -q
      - name: Environment helper tests
        working-directory: .
        run: python -m unittest discover -s scripts -p 'test_*.py'

  frontend:
    name: Frontend (typecheck, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
